name: Feature request
description: Suggest something new, or an FL Studio feature that LYNX SHARE is missing.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like LYNX SHARE to do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
      description: What you're trying to do, and how you do it today (in FL Studio or another DAW).
    validations:
      required: true

  - type: input
    id: reference
    attributes:
      label: Same feature elsewhere (optional)
      description: The FL Studio menu / plugin, or another DAW, that has it.
      placeholder: "FL Studio: Mixer › track › Audio output target"

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
